<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User configuration</title><style>
:root{font-family:"Avenir Next",Avenir,sans-serif;color:#17221c;background:#eef1e8}body{max-width:1080px;margin:0 auto;padding:32px}h1,h2{font-family:Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px}#logout{width:auto;margin:0;padding:9px 14px;background:transparent;color:#174b35}#logout:disabled{cursor:wait;opacity:.65}main{display:grid;grid-template-columns:1fr 1.3fr;gap:24px}section{background:#fff;border:1px solid #b8c1b7;padding:24px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #738078;border-radius:4px}button{margin-top:10px;background:#174b35;color:white;cursor:pointer}.user{padding:14px 0;border-bottom:1px solid #ddd}.user p{margin:4px 0;color:#526057}.user-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.user-actions button{font-size:.78rem;padding:7px}img{max-width:220px}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:18px}.user-actions{grid-template-columns:1fr}}
</style></head><body><header><h1>User configuration</h1><button id="logout" type="button">Sign out</button></header><main><section><h2>Create account</h2><form id="create"><label>Username</label><input name="username" required><label>Password</label><input name="password" type="password" minlength="12" required><label>Role</label><select name="role"><option value="user">Regular user</option><option value="admin">Administrator</option></select><label>Upload folder</label><input name="uploadFolder" placeholder="team/alex"><button>Create user</button></form><div id="setup"></div></section><section><h2>Storage</h2><p id="total"></p><div id="users"></div></section></main><script>
const users=document.querySelector('#users'),setup=document.querySelector('#setup'),format=value=>new Intl.NumberFormat(undefined,{style:'unit',unit:'megabyte',maximumFractionDigits:1}).format(value/1048576);async function patch(url,body){const response=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw new Error('Update failed')}function action(label,handler){const button=document.createElement('button');button.textContent=label;button.onclick=handler;return button}async function load(){const r=await fetch('/admin/storage/dashboard'),data=await r.json();document.querySelector('#total').textContent=`${format(data.totalUsedBytes)} used`;users.replaceChildren(...data.users.map(u=>{const item=document.createElement('article'),name=document.createElement('strong'),detail=document.createElement('p'),actions=document.createElement('div');item.className='user';actions.className='user-actions';name.textContent=u.username;detail.textContent=`${u.role} | ${format(u.storageUsedBytes)} used | ${u.storageQuotaBytes?format(u.storageQuotaBytes)+' quota':'default quota'} | ${u.trashRetentionDays} trash days`;actions.append(action('Set quota',async()=>{const value=prompt('Quota in GB; leave blank for default');await patch(`/admin/users/${u.id}/quota`,{storageQuotaBytes:value?Math.round(Number(value)*1073741824):null});load()}),action('Trash retention',async()=>{const days=prompt('Retention days',u.trashRetentionDays);if(days){await patch(`/admin/users/${u.id}/trash-retention`,{days:Number(days)});load()}}),action('Reset password',async()=>{const password=prompt('New password (12+ characters)');if(password)await patch(`/admin/users/${u.id}/password`,{password})}));item.append(name,detail,actions);return item}))}load();document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){setup.textContent=data.error||'Request failed';return}const title=document.createElement('h3'),image=document.createElement('img'),note=document.createElement('p');title.textContent=`Scan 2FA for ${data.user.username}`;image.src=data.qrCode;image.alt='TOTP QR code';note.textContent='Save this now. It is shown once.';setup.replaceChildren(title,image,note);e.target.reset();load()};
document.querySelector('#logout').onclick=async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='Signing out...';try{const response=await fetch('/auth/logout',{method:'POST'});await response.text();if(!response.ok)throw new Error('Sign out failed');location.href='/'}catch(error){button.disabled=false;button.textContent='Sign out';alert(error.message)}};
</script></body></html>
