services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:${POSTGRES_DATA_DIR}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTH_INTERVAL}
      timeout: ${POSTGRES_HEALTH_TIMEOUT}
      retries: ${POSTGRES_HEALTH_RETRIES}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
    restart: ${COMPOSE_RESTART_POLICY}

  ollama-vision-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${ENV_MOMENTS_QWEN_MODEL:-qwen3-vl:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
    restart: "no"

  ollama-text-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${ENV_MOMENTS_QWEN_TEXT_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
    restart: "no"

  server:
    image: ${SERVER_IMAGE}
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
      args:
        GO_IMAGE: ${GO_IMAGE}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
        ENV_MEDIA_DIR: ${ENV_MEDIA_DIR}
        ENV_TMP_DIR: ${ENV_TMP_DIR}
        ENV_PORT: ${ENV_PORT}
    env_file:
      - ../.env
    environment:
      ENV_MOMENTS_CV_WORKER: /app/moments-cv-worker
      ENV_MOMENTS_QWEN_URL: http://ollama:11434
      ENV_MOMENTS_QWEN_MODEL: ${ENV_MOMENTS_QWEN_MODEL:-qwen3-vl:4b}
      ENV_MOMENTS_QWEN_TEXT_MODEL: ${ENV_MOMENTS_QWEN_TEXT_MODEL:-qwen3:4b}
      ENV_MOMENTS_EMBEDDING_URL: ${ENV_MOMENTS_EMBEDDING_URL:-}
      ENV_MOMENTS_EMBEDDING_MODEL: ${ENV_MOMENTS_EMBEDDING_MODEL:-siglip}
    ports:
      - "${ENV_PORT}:${ENV_PORT}"
    volumes:
      - media_data:${ENV_MEDIA_DIR}
      - upload_tmp:${ENV_TMP_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-vision-model:
        condition: service_completed_successfully
      ollama-text-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${ENV_PORT}/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
    restart: ${COMPOSE_RESTART_POLICY}

volumes:
  postgres_data:
  ollama_data:
  media_data:
  upload_tmp:
