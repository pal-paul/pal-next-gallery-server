name: next-gallery-server

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uploader
      POSTGRES_USER: "<change-me>"
      POSTGRES_PASSWORD: "<change-me>"
    ports:
      - "127.0.0.1:5510:5432"
    volumes:
      - type: bind
        source: /volume1/docker/next-gallery-server/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

  embedding-api:
    profiles: ["ai"]
    image: ghcr.io/pal-paul/pal-next-gallery-server-embedding:latest
    environment:
      EMBEDDING_MODEL: openai/clip-vit-base-patch32
    volumes:
      - type: bind
        source: /volume1/docker/next-gallery-server/models
        target: /models/huggingface
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

  server:
    image: ghcr.io/pal-paul/pal-next-gallery-server:latest
    environment:
      ENV_GIN_MODE: release
      ENV_PORT: "8081"
      ENV_ADMIN_USERNAME: "<change-me>"
      ENV_ADMIN_PASSWORD: "<change-me>"
      ENV_ADMIN_CONFIG: "YES"
      ENV_WEB_DIR: ./web/dist
      ENV_DATABASE_URL: "postgres://<change-me>:<change-me>@postgres:5432/uploader?sslmode=disable"
      ENV_MAX_UPLOAD_SIZE_BYTES: "107374182400"
      ENV_MAX_PENDING_UPLOAD_BYTES_PER_USER: "107374182400"
      ENV_MAX_STORAGE_BYTES_PER_USER: "1099511627776"
      ENV_MIN_DISK_FREE_BYTES: "2147483648"
      ENV_MAX_ACTIVE_UPLOADS_PER_USER: "10"
      ENV_HTTP_READ_TIMEOUT: 5m
      ENV_CLEANUP_INTERVAL: 1h
      ENV_UPLOAD_RETENTION: 168h
      ENV_CORS_ALLOWED_ORIGINS: "https://gallery.palpaul.com,http://192.168.0.105:8013"
      ENV_TRUSTED_PROXIES: 172.30.0.2/32
      ENV_ISSUER: "<change-me>"
      ENV_AUTO_ALBUM_RUN_AT: "02:00"
      ENV_AUTO_ALBUM_TIMEZONE: Europe/Stockholm
      ENV_AI_FEATURE: "NO"
      ENV_MOMENTS_INTERVAL: 168h
      ENV_MOMENTS_CV_WORKER: /app/moments-cv-worker
      ENV_MOMENTS_GEMINI_URL: https://generativelanguage.googleapis.com/v1beta
      ENV_MOMENTS_GEMINI_API_KEY: "<change-me>"
      ENV_MOMENTS_GEMINI_MODEL: gemini-2.5-flash-lite
      ENV_MOMENTS_GEMINI_TEXT_MODEL: gemini-2.5-flash-lite
      ENV_MOMENTS_EMBEDDING_URL: http://embedding-api:8000/embed
      ENV_MOMENTS_EMBEDDING_MODEL: openai/clip-vit-base-patch32
      NAS_IMPORT_PATH: /data/import
      ENV_MEDIA_DIR: /data/gallery
      ENV_TMP_DIR: /data/tmp
    ports:
      - "8013:8081"
    volumes:
      - type: bind
        source: /volume1/media/gallery
        target: /data/gallery
        bind:
          create_host_path: true
      - type: bind
        source: /volume1/media/tmp
        target: /data/tmp
        bind:
          create_host_path: true
      - type: bind
        source: /volume1/media/import
        target: /data/import
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy
      embedding-api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - default
      - tunnel
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "<change-me>"
    depends_on:
      server:
        condition: service_healthy
    networks:
      tunnel:
        ipv4_address: 172.30.0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

networks:
  tunnel:
    ipam:
      config:
        - subnet: 172.30.0.0/24
