name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-image:
    name: Build container images
    needs: go-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read image configuration
        id: image-config
        shell: bash
        run: |
          set -a
          source .env.example
          set +a
          {
            echo "go_image=$GO_IMAGE"
            echo "runtime_image=$RUNTIME_IMAGE"
            echo "media_dir=$ENV_MEDIA_DIR"
            echo "tmp_dir=$ENV_TMP_DIR"
            echo "port=$ENV_PORT"
          } >> "$GITHUB_OUTPUT"

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          push: false
          build-args: |
            GO_IMAGE=${{ steps.image-config.outputs.go_image }}
            RUNTIME_IMAGE=${{ steps.image-config.outputs.runtime_image }}
            ENV_MEDIA_DIR=${{ steps.image-config.outputs.media_dir }}
            ENV_TMP_DIR=${{ steps.image-config.outputs.tmp_dir }}
            ENV_PORT=${{ steps.image-config.outputs.port }}
          cache-from: type=gha,scope=container-image-amd64
          cache-to: type=gha,mode=max,scope=container-image-amd64

      - name: Build embedding image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: embedding/Dockerfile
          push: false
          cache-from: type=gha,scope=embedding-image-amd64
          cache-to: type=gha,mode=max,scope=embedding-image-amd64
