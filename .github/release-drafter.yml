autolabeler:
  - label: "chore"
    files:
      - "*.md"
      - "docs/**/*.md"
    branch:
      - '/docs{0,1}\/.+/'
  - label: "bug"
    branch:
      - '/fix\/.+/'
      - '/hotfix\/.+/'
      - '/bug\/.+/'
    title:
      - "/^fix(\\(.+\\))?:/i"
  - label: "enhancement"
    branch:
      - '/feature\/.+/'
      - '/epic\/.+/'
      - '/story\/.+/'
      - '/enhance\/.+/'
name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
    exclude-labels:
      - "feature"
      - "enhancement"
  - title: "🧰 Maintenance"
    label: "chore"
    exclude-labels:
      - "feature"
      - "enhancement"
      - "fix"
      - "bugfix"
      - "bug"
change-template: |-
  ### $TITLE @$AUTHOR (#$NUMBER)

  <!-- PR_BODY_START -->
  $BODY
  <!-- PR_BODY_END -->
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
replacers:
  - search: '/<!-- PR_BODY_START -->[\s\S]*?<!-- RELEASE_NOTES_START -->\s*([\s\S]*?)\s*<!-- RELEASE_NOTES_END -->[\s\S]*?<!-- PR_BODY_END -->/g'
    replace: '$1'
  - search: '/<!-- PR_BODY_START -->[\s\S]*?<!-- PR_BODY_END -->/g'
    replace: ''
  - search: '/^[ \t]*<!--[^>]*-->[ \t]*\r?\n?/gm'
    replace: ''
  - search: '/\n{3,}/g'
    replace: '\n\n'
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
      - "chore"
  default: patch
template: |
  ## Changes
  $CHANGES
